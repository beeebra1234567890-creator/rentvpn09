эname: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        run: |
          if ls ./*.zip >/dev/null 2>&1; then
            unzip -q "$(ls ./*.zip | head -n1)" -d project
            DIR=$(dirname "$(find project -name settings.gradle.kts | head -n1)")
          else
            DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './project/*' | head -n1)")
          fi
          echo "PROJ=$DIR" >> "$GITHUB_ENV"
          echo "Project dir: $DIR"
          ls -la "$DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download libv2ray.aar
        working-directory: ${{ env.PROJ }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download -R 2dust/AndroidLibXrayLite -p '*.aar' -D app/libs --clobber
          for f in app/libs/*.aar; do [ "$f" != "app/libs/libv2ray.aar" ] && mv "$f" app/libs/libv2ray.aar; done || true
          ls -la app/libs

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RENT-VPN-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
